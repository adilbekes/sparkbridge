    mqtt:
      broker_url: "tcps://cloud.example.com:8883"
      client_id: "edge-node-102"
      username: ""
      password: ""
      keep_alive_sec: 30
      qos: 1
    sparkplug:
      group_id: "Kazakhstan"
      node_id: "bus_102"
